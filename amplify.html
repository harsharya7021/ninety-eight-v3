/* =========================================================================
   THE CREATOR FLOOR — effect 084, rows through depth (v3.51, Sep 2026)
   At Harsh's call the wall is now MWG 084 (it was 033 until v3.50.1). The
   pictures come in rows, five across (three on a phone), each row falling
   from far behind the top of the screen to the middle, where it stops,
   then on toward the viewer and out at the bottom; each picture drops into
   its row from the centre out and leaves the same way. All of it is
   scrubbed to the scroll, in the zip's numbers, on the room ground
   (White / Carbon, Archivo) with the four labels across the top.

   THE PICTURES ARE NOT EDITED HERE. They come from the Creator Wall board
   (a claude.ai artifact) through Workshop (build files)/build_creators_wall.py:
   the board holds the pictures, their order, their alt text and the four
   labels; a sync writes new pictures to assets/creators/ and regenerates
   this file from _creators_wall_template.html. Edit the template, not this.

   The CSS ships the READABLE state: the labels and a plain grid of every
   picture. The script adds .fx before it installs anything, so reduced
   motion or a blocked script still shows the whole wall, never a blank pin.
   ========================================================================= */
:root{ --room:#00933C; }   /* Creators' colour */

.w084{position:relative;padding:var(--m) var(--m) calc(var(--lh) * 3)}
.w084 .w-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px var(--gap);flex-wrap:wrap}
.w084 .w-head > *{font:inherit;margin:0}                      /* the h1 sets as the other labels do */
.w084 .w-head > :not(:first-child){opacity:var(--faint)}
.w084 .w-cue{display:none}
.w084 .w-medias{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:var(--gap);align-items:start;margin-top:calc(var(--lh) * 2)}
.w084 .media{display:block;width:100%;height:auto}

/* the effect: the zip's layout, once the script has taken over */
.w084.fx{padding:0}
.w084.fx .w-cue{display:block;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;margin:0;pointer-events:none;opacity:var(--faint)}
.w084.fx .w-container{position:relative;height:100vh;overflow:hidden}   /* the pinned screen; rows thrown at the viewer are clipped to it */
.w084.fx .w-head{position:absolute;top:0;left:0;right:0;padding:var(--m);z-index:999}   /* over every row, however many */
.w084.fx .w-medias{display:block;position:absolute;inset:0;margin:0;perspective:120vw}
.w084.fx .w-row{display:flex;justify-content:center;align-items:center;gap:3vw;width:100%;position:absolute;top:0;left:0;transform-style:preserve-3d}
.w084.fx .media{width:min(16vw, 52vh);transform-style:preserve-3d}    /* 16vw as in the zip; only a very short, wide window caps it, so a row always fits between the labels and the bottom */
@media(max-width:768px){
  .w084.fx .w-medias{perspective:200vw}
  .w084.fx .media{width:28vw}
}
</style>

<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script>
/* ---- 084: rows through depth, scrubbed to the scroll ----
   The zip's driver and numbers: rows of five (three at 768px and under);
   each row comes from z −80% of the screen's width, a row's height above
   the top, to the middle at z 0 (half a crossing, power3.inOut), then
   goes on to z +80% and a screen below (the other half); its pictures drop
   in from 200% above, the centre one first, 0.03 apart, and leave 200%
   down the same way. Departures, each forced:
   1. Lenis stays out: the site scrolls natively everywhere.
   2. The zip starts its rows 1/n of a crossing apart in a fixed 500vh, which
      is right for its three rows only: with the board's forty-odd pictures
      (nine rows, fifteen on a phone) the rows would arrive on top of one
      another and hide each other. Rows here start a third of a crossing
      apart, as the zip's three do, and the pin grows with the rows instead:
      240vh of scroll per crossing, the zip's own pace. So each row has the
      middle of the screen to itself when it stops there; nothing covers it.
   3. The depth is a function and the pin invalidates on refresh, so a
      resize re-measures; crossing 768px regroups the rows (five ↔ three),
      and turning reduced motion on puts the readable grid back.
   4. Nothing is installed without GSAP or with reduced motion: the grid stays. */
(function(){
  var root = document.getElementById('wall'); if (!root) return;
  if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;
  var pin = root.querySelector('.w-pin'), screen = root.querySelector('.w-container');
  var box = root.querySelector('.w-medias'), cue = root.querySelector('.w-cue');
  var medias = [].slice.call(root.querySelectorAll('.media'));
  if (!pin || !screen || !box || !medias.length) return;
  gsap.registerPlugin(ScrollTrigger);

  var STEP = 1 / 3;      /* rows start a third of a crossing apart */
  var PACE = 240;        /* vh of scroll per crossing */

  gsap.matchMedia().add({ phone: '(max-width: 768px)', desk: 'not all and (max-width: 768px)', still: '(prefers-reduced-motion: reduce)' }, function(ctx){
    if (ctx.conditions.still) return;
    var perRow = ctx.conditions.phone ? 3 : 5, rows = [];
    root.classList.add('fx');
    for (var i = 0; i < medias.length; i += perRow){
      var row = document.createElement('div');
      row.className = 'w-row';
      medias.slice(i, i + perRow).forEach(function(m){ row.appendChild(m); });
      box.appendChild(row); rows.push(row);
    }
    pin.style.height = (100 + PACE * (1 + (rows.length - 1) * STEP)) + 'vh';

    gsap.to(cue, {
      autoAlpha: 0, duration: 0.2,
      scrollTrigger: { trigger: root, start: 'top top', end: 'top top-=1', toggleActions: 'play none reverse none' }
    });

    var master = gsap.timeline({
      scrollTrigger: { trigger: pin, start: 'top top', end: 'bottom bottom', pin: screen, scrub: true, invalidateOnRefresh: true }
    });
    rows.forEach(function(row, i){
      var pics = row.querySelectorAll('.media'), tl = gsap.timeline();
      tl.fromTo(row, { zIndex: rows.length - i, z: function(){ return -0.8 * innerWidth; }, yPercent: -100, y: 0 },
                     { z: 0, yPercent: -50, y: '50vh', duration: 0.5, ease: 'power3.inOut' });
      tl.fromTo(pics, { yPercent: -200 }, { yPercent: 0, stagger: { each: 0.03, from: 'center' }, duration: 0.35, ease: 'power3.inOut' }, '<');
      tl.to(row, { z: function(){ return 0.8 * innerWidth; }, yPercent: 0, y: '100vh', duration: 0.5, ease: 'power3.inOut' });
      tl.to(pics, { yPercent: 200, stagger: { each: 0.03, from: 'center' }, duration: 0.35, ease: 'power3.inOut' }, '<');
      master.add(tl, i * STEP);
    });

    return function(){                    /* leaving this layout: pictures back in order, rows gone */
      medias.forEach(function(m){ box.appendChild(m); });
      rows.forEach(function(r){ r.remove(); });
      pin.style.height = '';
      root.classList.remove('fx');
    };
  });
})();
</script>
