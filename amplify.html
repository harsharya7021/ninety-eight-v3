/* =========================================================================
   THE CREATOR FLOOR — effect 033, the wall (v3.50, Sep 2026)
   At Harsh's call the page is one effect: MWG 033, a pinned horizontal wall
   of pictures in three rows. Each frame is thrown in from the right as its
   left edge crosses 110% → 65% of the screen (a random roll of up to ±40°,
   up to 150% off its line, up to 400% of its width behind) and thrown out
   to the left as its right edge crosses 35% → −10%, all scrubbed to the
   scroll. The zip's numbers, on the room ground (White / Carbon, Archivo).

   THE PICTURES ARE NOT EDITED HERE. They come from the Creator Wall board
   (a claude.ai artifact) through Workshop (build files)/build_creators_wall.py:
   the board holds the pictures, their order, their alt text and the four
   labels; a sync writes new pictures to assets/creators/ and regenerates
   this file from _creators_wall_template.html. Edit the template, not this.

   The CSS ships the READABLE state: the labels and a plain grid of every
   picture. The script adds .fx before it installs anything, so reduced
   motion or a blocked script still shows the whole wall, never a blank pin.
   ========================================================================= */
:root{ --room:#00933C; }   /* Creators' colour */

.w033{position:relative;padding:var(--m) var(--m) calc(var(--lh) * 3)}
.w033 .w-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px var(--gap);flex-wrap:wrap}
.w033 .w-head > *{font:inherit;margin:0}                      /* the h1 sets as the other labels do */
.w033 .w-head > :not(:first-child){opacity:var(--faint)}
.w033 .w-cue{display:none}
.w033 .w-medias{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:var(--gap);margin-top:calc(var(--lh) * 2)}
.w033 .media{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain}

/* the effect: the zip's layout, once the script has taken over */
.w033.fx{height:100vh;height:100svh;overflow:hidden;padding:0}
.w033.fx .w-head{position:absolute;top:0;left:0;right:0;padding:var(--m);z-index:2}
.w033.fx .w-cue{display:block;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;opacity:var(--faint)}
.w033.fx .w-container{height:100%;width:max-content;padding:0 110vw;display:flex;align-items:center;white-space:nowrap;will-change:transform}
.w033.fx .w-medias{display:grid;grid-template-columns:none;grid-template-rows:repeat(3,auto);grid-auto-flow:column;align-items:center;gap:3vw;margin:0}
.w033.fx .media{width:15vw;height:15vw;aspect-ratio:auto;position:relative;will-change:transform}
@media(max-width:768px){
  .w033.fx .w-medias{gap:6vw}
  .w033.fx .media{width:35vw;height:35vw}
}
</style>

<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script>
/* ---- 033: the wall, scrubbed to the scroll ----
   The zip's driver and numbers. Departures, each forced:
   1. Lenis stays out: the site scrolls natively everywhere.
   2. The travel is a function and the pin invalidates on refresh, so a
      resize (or a phone turning) re-measures the wall instead of keeping
      the distance it had at load; the zip measured once.
   3. Nothing is installed until .fx is on, and nothing at all with reduced
      motion or without GSAP: the readable grid stays. */
(function(){
  var root = document.getElementById('wall'); if (!root) return;
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;
  var container = root.querySelector('.w-container');
  var medias = [].slice.call(root.querySelectorAll('.media'));
  if (!container || !medias.length) return;
  gsap.registerPlugin(ScrollTrigger);
  root.classList.add('fx');

  gsap.to(root.querySelector('.w-cue'), {
    autoAlpha: 0, duration: 0.2,
    scrollTrigger: { trigger: root, start: 'top top', end: 'top top-=1', toggleActions: 'play none reverse none' }
  });

  var W = innerWidth;
  medias.forEach(function(media){
    gsap.set(media, { x: (Math.random() - 0.5) * 0.16 * W, y: (Math.random() - 0.5) * 0.1 * W });
  });

  function distance(){ return Math.max(0, container.offsetWidth - document.documentElement.clientWidth); }
  var scrollTween = gsap.to(container, {
    x: function(){ return -distance(); },
    ease: 'none',
    scrollTrigger: {
      trigger: root, pin: true, scrub: true, invalidateOnRefresh: true,
      end: function(){ return '+=' + distance(); }
    }
  });

  medias.forEach(function(media){
    gsap.from(media, {
      rotation: (Math.random() - 0.5) * 80,        /* between -40 and 40 */
      yPercent: (Math.random() - 0.5) * 300,       /* between -150 and 150 */
      xPercent: Math.random() * 400,               /* between 0 and 400 */
      ease: 'power1.out',
      scrollTrigger: { trigger: media, containerAnimation: scrollTween, start: 'left 110%', end: 'left 65%', scrub: true }
    });
    gsap.fromTo(media, { rotation: 0, yPercent: 0, xPercent: 0 }, {
      rotation: (Math.random() - 0.5) * 80,
      yPercent: (Math.random() - 0.5) * 300,
      xPercent: -Math.random() * 400,              /* between 0 and -400 */
      ease: 'power1.in',
      scrollTrigger: { trigger: media, containerAnimation: scrollTween, start: 'right 35%', end: 'right -10%', scrub: true }
    });
  });
})();
</script>
